services:
    mongodb:
        image: mongodb/mongodb-community-server:latest
        container_name: mongodb
        restart: unless-stopped
        ports:
            - "27017:27017"
        env_file:
            - .env.dev
        volumes:
            - mongodb:/data/db
            - ./scripts/mongo-init:/docker-entrypoint-initdb.d
